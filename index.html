<body data-lang="es">
  <button id="langToggle" class="lang-toggle floating-lang" type="button" aria-label="Cambiar idioma / Change language">
    <span class="lang-es">ES</span><span class="lang-en">EN</span>
  </button>

  <main id="stage" class="stage">
    <div class="portrait" aria-hidden="true"></div>
    <nav id="stripes" class="stripes" aria-label="Secciones"></nav>
  </main>

  <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" aria-hidden="true">
    <button id="closePanel" class="close-btn" type="button" aria-label="Cerrar / Close">&times;</button>
    <div class="panel-inner" id="panelInner">
      <span class="panel-index"></span>
      <h2 id="panelTitle" class="panel-title"></h2>
      <div class="panel-text"></div>
    </div>
    <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="Volver arriba / Back to top">&uarr;</button>
  </section>

  <div id="pressLightbox" class="press-lightbox" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="pressLightboxCounter" aria-hidden="true">
    <button id="pressClose" class="press-lightbox-close" type="button" aria-label="Cerrar / Close">&times;</button>
    <a id="pressDownload" class="press-lightbox-download" href="#" download aria-label="Descargar / Download">&#8681;</a>
    <span id="pressLightboxCounter" class="press-lightbox-counter" aria-live="polite">1 / 12</span>
    <button id="pressPrev" class="press-lightbox-arrow press-lightbox-prev" type="button" aria-label="Foto anterior / Previous photo">&#8249;</button>
    <img id="pressLightboxImage" src="" alt="">
    <button id="pressNext" class="press-lightbox-arrow press-lightbox-next" type="button" aria-label="Foto siguiente / Next photo">&#8250;</button>
  </div>

  <script type="module" src="js/app.js"></script>
